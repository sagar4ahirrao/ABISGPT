name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,faiss]"
      - name: Lint (ruff)
        run: ruff check openabis scripts tests
      - name: Tests
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"   # torch+faiss Windows DLL clash
        run: pytest -q --cov=openabis --cov-report=term-missing

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install -e ".[dev]" mypy
          mypy openabis --ignore-missing-imports
      continue-on-error: true     # loosen once typing coverage grows

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs link sanity (markdown existence)
        run: |
          test -f README.md
          test -f docs/white_paper.md
          test -f docs/ARCHITECTURE.md
          test -f docs/RESPONSIBLE-USE.md
          test -f docs/BENCHMARKS.md
          test -f CITATION.cff
