[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openabis"
version = "0.1.0"
description = "Multi-modal ABIS & passive PAD reference implementation: ViT encoders, VLM liveness guardrails, temporal rPPG, and two-tier ANN vector retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenABIS Contributors" }]
keywords = [
  "biometrics", "abis", "pad", "liveness", "deepfake-detection",
  "vision-transformer", "vision-language-model", "rppg",
  "vector-search", "hnsw", "product-quantization", "ann",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = [
  "numpy>=1.26",
  "torch>=2.1",
  "opencv-python>=4.8",
  "tqdm>=4.66",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8"]
qdrant = ["qdrant-client>=1.9"]
milvus = ["pymilvus>=2.3"]
gpu = ["faiss-gpu-cu12>=1.8"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "black>=24.0",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["openabis*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
