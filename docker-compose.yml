# ABISGPT reference stack: Qdrant vector graph + the FastAPI service.
#
#   docker compose up -d          # start qdrant + api
#   curl localhost:8000/health
#   docker compose down           # stop (add -v to wipe the vector store)
#
# Optional Milvus 2.3 standalone backend (etcd + minio + milvus):
#   docker compose --profile milvus up -d milvus
#   ABISGPT_RUN_INTEGRATION=1 pytest tests/test_milvus_integration.py
#
# The api image is torch-free (hash encoder + rPPG/flash PAD). Env knobs:
#   ABISGPT_VLM=heuristic  enables the texture-statistics VLM stand-in tier
#   ABISGPT_CONFIG=/app/configs/model.yaml mounts the YAML knobs into the service

services:
  qdrant:
    image: qdrant/qdrant:v1.9.7
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':< /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      ABISGPT_INDEX_BACKEND: qdrant
      ABISGPT_INDEX_URI: http://qdrant:6333
      ABISGPT_VLM: heuristic
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy

  # --- Milvus 2.3 standalone (optional, profile: milvus) ----------------- #
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    profiles: ["milvus"]

  milvus-minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z   # mirror of minio/minio (old tags removed from Docker Hub)
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_minio:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ["milvus"]

  milvus:
    image: milvusdb/milvus:v2.3.4      # matches host pymilvus 2.3.x client
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/healthz || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 20
    profiles: ["milvus"]

volumes:
  qdrant_data:
  milvus_etcd:
  milvus_minio:
  milvus_data:

