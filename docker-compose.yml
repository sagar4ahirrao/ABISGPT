# OpenABIS reference stack: Qdrant vector graph + the FastAPI service.
#
#   docker compose up -d          # start qdrant + api
#   curl localhost:8000/health
#   docker compose down           # stop (add -v to wipe the vector store)
#
# The api image is torch-free (hash encoder + rPPG/flash PAD). Env knobs:
#   OPENABIS_VLM=heuristic  enables the texture-statistics VLM stand-in tier
#   OPENABIS_CONFIG=/app/configs/model.yaml mounts the YAML knobs into the service

services:
  qdrant:
    image: qdrant/qdrant:v1.9.7
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':< /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      OPENABIS_INDEX_BACKEND: qdrant
      OPENABIS_INDEX_URI: http://qdrant:6333
      OPENABIS_VLM: heuristic
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_data:
